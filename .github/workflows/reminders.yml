name: Daily Parking Reminders

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Expire old available spaces
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SERVICE_ROLE_KEY }}" \
            -d '{"state":"unavailable","from_date":null,"to_date":null}' \
            "https://uioehziiyopvhudqvenc.supabase.co/rest/v1/spaces?state=eq.available&to_date=lt.$(date -u +%Y-%m-%d)")
          echo "Expire spaces response: $RESPONSE"

      - name: Trigger reminder emails
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SERVICE_ROLE_KEY }}" \
            -d '{}' \
            "https://uioehziiyopvhudqvenc.supabase.co/functions/v1/send-reminders")
          echo "Response: $RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: HTTP $HTTP_CODE"
            exit 1
          fi
